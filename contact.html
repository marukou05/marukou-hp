    <style>
        :root {

            --bg-blue: #f4f7f9;
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; padding: 0; 
            font-family: 'Noto Sans JP', sans-serif; 
            color: var(--text); 
            line-height: 1.8; 
            background: linear-gradient(rgba(240, 248, 255, 0.93), rgba(240, 248, 255, 0.93)),

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .main-container {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 60px rgba(0,0,0,0.05);
        }

        /* --- ナビゲーション --- */
        .top-nav { 
            background: rgba(255, 255, 255, 0.98); 
            padding: 15px 0; 
            border-bottom: 2px solid var(--navy); 
            position: sticky; 
            top: 0; 
            z-index: 1100; 
            backdrop-filter: blur(10px); 
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .logo-text-nav {
            font-family: 'Noto Serif JP', serif;
            font-size: 1.5rem;
            color: var(--navy);
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 0.05em;
        }
        .nav-links a {
            margin-left: 15px;
            text-decoration: none;
            color: var(--navy);
            font-weight: 700;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .nav-links a:hover { color: var(--gold); }

        .container { max-width: 800px; width: 100%; margin: 0 auto; padding: 40px 20px 80px; flex: 1; }
        
        h1 { 
            color: var(--navy); 
            text-align: center; 
            margin-bottom: 30px; 
            font-size: 2.2rem; 
            border-bottom: 3px solid var(--gold); 
            display: inline-block; 
            width: 100%; 
            padding-bottom: 15px; 
            font-family: 'Noto Serif JP', serif;
            letter-spacing: 4px;
        }

        .contact-card { 
            background: #fff; 
            padding: 40px; 
            border-radius: 6px; 
            border: 1px solid var(--accent-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }

        .contact-intro { 
            margin-bottom: 30px; 
            font-size: 1.05rem; 
            color: var(--navy); 
            font-weight: 700; 
            text-align: center;
            line-height: 1.7;
        }

        /* フォームスタイル */
        .simple-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
            text-align: left;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 700;
            color: var(--navy);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-req {
            background: #e74c3c;
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .badge-opt {
            background: #7f8c8d;
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .form-control {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--navy);
            box-shadow: 0 0 5px rgba(0, 33, 71, 0.2);
        }

        textarea.form-control {
            min-height: 120px;
            resize: vertical;
        }
