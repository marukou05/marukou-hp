        :root {

        .main-container {

            display: flex;

        }

        /* --- ナビゲーション --- */
        .top-nav { 
            background: #ffffff;

            position: sticky;

            z-index: 1100;

        .nav-container {

            color: var(--navy);
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 0.05em;

        .nav-links a {

            color: var(--navy);
            font-weight: 700;
            font-size: 0.95rem;
            transition: 0.3s;
        }
        .nav-links a:hover { color: var(--gold); }

        /* PCでの横幅を絞って見やすく調整 */
        .container { 
            max-width: 720px; 
            width: 100%;

            padding: 0 20px 60px;

            letter-spacing: 3px;

            background: #ffffff !important;

            border: 1px solid #dcdfe6;

            z-index: 10;
            display: block;
            width: 100%;
        }

        .contact-intro {

            color: var(--navy); 
            font-weight: 700; 
            text-align: center;
            line-height: 1.7;
        }

        /* Formrunダイレクト埋め込み枠の最適化 */
        .formrun-iframe-wrapper {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            overflow: hidden;
        }
        
        .formrun-iframe {
            width: 100%;
            height: 720px;
            border: none;
            display: block;
        }

        /* 区切り線 */
        .divider-area {
            position: relative;
            text-align: center;
            margin: 35px 0 25px;
        }
        .divider-area::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: #cbd5e1;
            z-index: 1;
        }
        .divider-title {
            position: relative;
            z-index: 2;
            background: #ffffff;
            padding: 0 15px;
            color: var(--navy);
            font-weight: 700;
            font-size: 0.95rem;
        }

        /* LINE・電話エリア */
        .line-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: var(--line-green); 
            color: #ffffff !important; 
            text-decoration: none; 
            padding: 16px; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 1.1rem; 
            margin: 0 auto 25px; 
            width: 100%;
            transition: 0.3s;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(6, 199, 85, 0.2);
        }
        .line-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(6, 199, 85, 0.3);
        }

        .tel-area { 
            border-top: 1px dashed #cbd5e1; 
            padding-top: 25px; 
            text-align: center;
        }
        .tel-label { font-size: 0.95rem; color: var(--navy); display: block; margin-bottom: 8px; font-weight: 700; }
